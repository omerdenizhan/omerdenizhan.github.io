<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yapım Aşamasında | Under Construction</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Arka Plan Işığı -->
  <div class="glow-orb"></div>

  <!-- En Sağ Üst Butonlar (Dil solda, Tema sağda) -->
  <div class="top-controls">
    <!-- Dil Değiştirme Butonu -->
    <button class="icon-btn" id="langToggle" aria-label="Language Toggle">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="2" y1="12" x2="22" y2="12"></line>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
      </svg>
    </button>

    <!-- Tema Değiştirme Butonu -->
    <button class="icon-btn" id="themeToggle" aria-label="Theme Toggle">
      <!-- Ay İkonu (Koyu moddayken görünür) -->
      <svg id="moonIcon" viewBox="0 0 24 24">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
      <!-- Güneş İkonu (Açık moddayken görünür) -->
      <svg id="sunIcon" viewBox="0 0 24 24" style="display: none;">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
    </button>
  </div>

  <!-- Ekranın Tam Ortasındaki Bakım Kartı -->
  <main class="maintenance-card">
    <div class="status-badge">
      <span class="pulse-dot"></span>
      <span id="badgeText">Sistem Güncelleniyor</span>
    </div>

    <div class="main-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
      </svg>
    </div>

    <h1 class="title" id="titleText">Yapım Aşamasında</h1>
    <p class="description" id="descText">
      Sizlere daha iyi bir deneyim sunabilmek için sistemlerimizi yeniliyoruz. Anlayışınız için teşekkür ederiz, en kısa sürede tekrar yayındayız.
    </p>
  </main>

  <script src="script.js"></script>
</body>
</html>
